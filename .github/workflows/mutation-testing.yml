name: Mutation Testing

# Laeuft jetzt auch bei jedem Pull Request (siehe Issue #194) - ein voller
# Stryker-Lauf dauert bei der aktuellen Codebase-Groesse nur rund 4 Minuten,
# das ist als zusaetzlicher PR-Check vertretbar. Der woechentliche Cron-Lauf
# bleibt als Sicherheitsnetz bestehen (faengt z. B. Drift durch Abhaengigkeits-
# Updates ab, die ohne eigenen PR-Code-Diff durchrutschen wuerden).
# "workflow_dispatch" erlaubt zusaetzlich einen manuellen Lauf.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Mutation-Tests
        run: npm run test:mutation

      - name: Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 30
