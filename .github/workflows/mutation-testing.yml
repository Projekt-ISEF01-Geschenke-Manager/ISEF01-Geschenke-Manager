name: Mutation Testing

# Laeuft bei jedem Pull Request (siehe Issue #194) und nach jedem Merge in
# main. Stryker arbeitet inkrementell ("incremental" in stryker.config.json):
# nur geaenderter Code bzw. geaenderte Tests werden neu mutiert, alles andere
# kommt aus dem gespeicherten Ergebnis (actions/cache). Dadurch dauert ein
# PR-Lauf meist nur wenige Minuten statt >10. Der Lauf auf main baut den
# Basis-Cache fuer die PRs auf. Der woechentliche Cron-Lauf bleibt als
# Sicherheitsnetz bestehen, "workflow_dispatch" erlaubt manuelle Laeufe.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Stryker-Ergebnis der letzten Laeufe wiederherstellen (erst vom eigenen
      # Branch, sonst von main) und nach dem Lauf neu speichern.
      - name: Inkrementellen Stand wiederherstellen
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ github.head_ref || github.ref_name }}-
            stryker-incremental-main-

      - name: Mutation-Tests
        run: npm run test:mutation

      - name: Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 30
